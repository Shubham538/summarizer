research_updates:
  description: >
    Conduct thorough research on {{raw_text}}. Consider Focus on:
    1. Extract Report Title, Report Number, Author(s) Name
    2. Get information from General background, Executive Summary of the candidate 
    3. Assess the profile competency and tacit knowledge
    4. Assess the Risks and Challenges for the Future 
    5. Extract the Replicable content and potential values - lessons learned, best practices, opportunity for improvement
    6. Provide Recommendations
    7. Extract Keywords
    Make sure to organize your findings in a structured format with clear sections and accurate information.
    

  expected_output: >
    A comprehensive research document with well-organized sections covering the tangible impact and value that the lesson learned or best practice deliveries of {{raw_text}}. Include specific facts, figures, and examples where relevant. Remove the table of contents. The summarized content should not exceed 500 words.
  
  agent: researcher
  output_file: "research_findings.txt"

