[project]
name = "summarizer"
version = "0.1.0"
description = "summarizer using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0"
]

[project.scripts]
summarizer = "summarizer.main:run"
run_crew = "summarizer.main:run"
train = "summarizer.main:train"
replay = "summarizer.main:replay"
test = "summarizer.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
